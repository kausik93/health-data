[project]
name = "health-data"
version = "0.1.0"
description = "Ingests Hevy and MyNetDiary weekly export snapshots into a queryable SQLite database."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
backup-db = "health_data.backup:main"
sync-exercise = "health_data.sync_exercise:main"
sync-diet = "health_data.sync_diet:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_data"]
